name: Refresh profile visuals

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile-visuals.yml'

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Build original artwork
        run: python3 scripts/build_visuals.py
      - name: Refresh public contribution data
        env:
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/update_activity.py --username "$PROFILE_USER"
      - name: Validate README and artwork
        run: python3 scripts/validate_profile.py
      - name: Commit refreshed assets
        run: |
          git add assets/
          if git diff --cached --quiet; then
            echo "Profile visuals already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public contribution visuals'
          git push origin HEAD:main
