<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">Monthly contribution pulse</title><desc id="desc">Monthly sums of the displayed GitHub calendar. The first and last month may be partial. Language use and contribution counts are not measures of skill.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#040b19"/><stop offset=".55" stop-color="#0b1432"/><stop offset="1" stop-color="#190f36"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#77e7ff"/><stop offset=".52" stop-color="#448aff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#4358f6" stop-opacity=".35"/><stop offset="1" stop-color="#6754fb" stop-opacity="0"/></radialGradient>
<linearGradient id="shade"><stop stop-color="#050c1c"/><stop offset=".62" stop-color="#050c1c" stop-opacity=".93"/><stop offset="1" stop-color="#050c1c" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-60%" y="-80%" width="220%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7f9bdf" stroke-opacity=".055"/></pattern>
<clipPath id="bounds"><rect x="1" y="1" width="1198" height="248" rx="18"/></clipPath>
</defs><style>
text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:'DejaVu Sans Mono',Consolas,monospace}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 32s linear infinite}
.reverse{animation-direction:reverse;animation-duration:45s}
.current{stroke-dasharray:95 1100;animation:current 9s linear infinite}
.spark{animation:spark 7s ease-in-out infinite}
.glitch{opacity:0;animation:glitch 9s steps(1,end) infinite}
.glitch2{animation-delay:-4.5s}
.pulse{animation:pulse 5s ease-in-out infinite}
.scan{animation:scan 12s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes current{to{stroke-dashoffset:-1195}}
@keyframes spark{0%,35%,54%,100%{opacity:.25}40%,48%{opacity:1}44%{opacity:.6}}
@keyframes glitch{0%,88%,94%,100%{opacity:0;transform:translateX(0)}89%,92%{opacity:.7;transform:translateX(4px)}90%,93%{opacity:.45;transform:translateX(-3px)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes scan{0%{transform:translateX(-100px);opacity:0}10%,90%{opacity:.65}100%{transform:translateX(1200px);opacity:0}}
@keyframes rain{from{transform:translateY(-240px)}to{transform:translateY(240px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.glitch,.scan{display:none}.type-animated{display:none}.type-static{display:block!important}}
</style>
<g clip-path="url(#bounds)"><rect width="1200" height="250" fill="url(#bg)"/><rect width="1200" height="250" fill="url(#grid)"/>
<text x="30" y="33" font-size="13" fill="#77e7ff" class="mono" letter-spacing="1">ACTIVITY PULSE  /  MONTHLY CONTRIBUTIONS</text><path d="M90 178H1128" stroke="#233553" stroke-dasharray="3 6"/><text x="76" y="182" font-size="10" fill="#a6b8d6" class="mono" text-anchor="end">0</text><path d="M90 122.0H1128" stroke="#233553" stroke-dasharray="3 6"/><text x="76" y="126.0" font-size="10" fill="#a6b8d6" class="mono" text-anchor="end">20</text><path d="M90 66H1128" stroke="#233553" stroke-dasharray="3 6"/><text x="76" y="70" font-size="10" fill="#a6b8d6" class="mono" text-anchor="end">40</text><text x="90.0" y="201" font-size="11" fill="#a6b8d6" class="mono" text-anchor="middle">Oct</text><text x="90.0" y="168.0" font-size="11" fill="#c1cfff" class="mono" text-anchor="middle">0</text><text x="176.2" y="201" font-size="11" fill="#a6b8d6" class="mono" text-anchor="middle">Nov</text><text x="176.2" y="168.0" font-size="11" fill="#c1cfff" class="mono" text-anchor="middle">0</text><text x="262.5" y="201" font-size="11" fill="#a6b8d6" class="mono" text-anchor="middle">Dec</text><text x="262.5" y="168.0" font-size="11" fill="#c1cfff" class="mono" text-anchor="middle">0</text><text x="348.8" y="201" font-size="11" fill="#a6b8d6" class="mono" text-anchor="middle">Jan</text><text x="348.8" y="168.0" font-size="11" fill="#c1cfff" class="mono" text-anchor="middle">0</text><text x="435.0" y="201" font-size="11" fill="#a6b8d6" class="mono" text-anchor="middle">Feb</text><text x="435.0" y="168.0" font-size="11" fill="#c1cfff" class="mono" text-anchor="middle">0</text><text x="521.2" y="201" font-size="11" fill="#a6b8d6" class="mono" text-anchor="middle">Mar</text><text x="521.2" y="168.0" font-size="11" fill="#c1cfff" class="mono" text-anchor="middle">0</text><text x="607.5" y="201" font-size="11" fill="#a6b8d6" class="mono" text-anchor="middle">Apr</text><text x="607.5" y="168.0" font-size="11" fill="#c1cfff" class="mono" text-anchor="middle">0</text><text x="693.8" y="201" font-size="