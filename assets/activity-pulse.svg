cy="178.0" r="3.5" fill="#77e7ff"/><circle cx="780.0" cy="102.4" r="3.5" fill="#77e7ff"/><circle cx="866.2" cy="169.6" r="3.5" fill="#77e7ff"/><circle cx="952.5" cy="152.8" r="3.5" fill="#77e7ff"/><circle cx="1038.8" cy="152.8" r="3.5" fill="#77e7ff"/><circle cx="1125.0" cy="77.2" r="3.5" fill="#77e7ff"/><text x="600" y="231" font-size="10" fill="#a6b8d6" class="mono" text-anchor="middle">COUNTS FROM THE DISPLAYED CALENDAR  ·  FIRST / LAST MONTH MAY BE PARTIAL</text></g><rect x="1" y="1" width="1198" height="248" rx="18" fill="none" stroke="#31466c" stroke-opacity=".8"/></svg>
