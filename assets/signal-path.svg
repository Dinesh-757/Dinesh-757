<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
<title id="title">Signal Path — Dilli Dinesh’s security engineering workflow</title><desc id="desc">Capture packets and file events; detect with models, rules and IOCs; investigate context and triage; respond by documenting and improving.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#040b19"/><stop offset=".55" stop-color="#0b1432"/><stop offset="1" stop-color="#190f36"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#77e7ff"/><stop offset=".52" stop-color="#448aff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#4358f6" stop-opacity=".35"/><stop offset="1" stop-color="#6754fb" stop-opacity="0"/></radialGradient>
<linearGradient id="shade"><stop stop-color="#050c1c"/><stop offset=".62" stop-color="#050c1c" stop-opacity=".93"/><stop offset="1" stop-color="#050c1c" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-60%" y="-80%" width="220%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7f9bdf" stroke-opacity=".055"/></pattern>
<clipPath id="bounds"><rect x="1" y="1" width="1198" height="198" rx="18"/></clipPath>
</defs><style>
text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:'DejaVu Sans Mono',Consolas,monospace}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 32s linear infinite}
.reverse{animation-direction:reverse;animation-duration:45s}
.current{stroke-dasharray:95 1100;animation:current 9s linear infinite}
.spark{animation:spark 7s ease-in-out infinite}
.glitch{opacity:0;animation:glitch 9s steps(1,end) infinite}
.glitch2{animation-delay:-4.5s}
.pulse{animation:pulse 5s ease-in-out infinite}
.scan{animation:scan 12s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes current{to{stroke-dashoffset:-1195}}
@keyframes spark{0%,35%,54%,100%{opacity:.25}40%,48%{opacity:1}44%{opacity:.6}}
@keyframes glitch{0%,88%,94%,100%{opacity:0;transform:translateX(0)}89%,92%{opacity:.7;transform:translateX(4px)}90%,93%{opacity:.45;transform:translateX(-3px)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes scan{0%{transform:translateX(-100px);opacity:0}10%,90%{opacity:.65}100%{transform:translateX(1200px);opacity:0}}
@keyframes rain{from{transform:translateY(-240px)}to{transform:translateY(240px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.glitch,.scan{display:none}.type-animated{display:none}.type-static{display:block!important}}
</style>
<g clip-path="url(#bounds)"><rect width="1200" height="200" fill="url(#bg)"/><rect width="1200" height="200" fill="url(#grid)"/>
<text x="28" y="35" font-size="14" fill="#77e7ff" class="mono" letter-spacing="1">SIGNAL PATH  //  FROM OBSERVATION TO ACTION</text><rect x="28" y="58" width="260" height="91" rx="9" fill="#0c1930" stroke="#2c4365"/><text x="46" y="81" font-size="10" fill="#a78bfa" class="mono" letter-spacing="1">STAGE 01</text><text x="46" y="109" font-size="23" fill="#edf5ff" font-weight="700">CAPTURE</text><text x="46" y="133" font-size="13" fill="#a6b8d6" >Packets · File events</text><path d="M292 104H317m-6-5 6 5-6 5" fill="none" stroke="#6385ba"/><rect x="322" y="58" width="260" height="91" rx="9" fill="#0c1930" stroke="#2c4365"/><text x="340" y="81" font-size="10" fill="#a78bfa" class="mono" letter-spacing="1">STAGE 02</text><text x="340" y="109" font-size="23" fill="#edf5ff" font-weight="700">DETECT</text><text x="340" y="133" font-size="13" fill="#a6b8d6" >Models · Rules · IOCs</text><path d="M586 104H611m-6-5 6 5-6 5" fill="none" stroke="#6385ba"/><rect x="616" y="58" width="260" height="91" rx="9" fill="#0c1930" stroke="#2c4365"/><text x="634" y="81" font-size="10" fill="#a78bfa" class="mono" letter-spacing="1">STAGE 03</text><text x="634" y="109" font-size="23" fill="#edf5ff" font-weight="700">INVESTIGATE</text><text x="634" y="133" font-size="13" fill="#a6b8d6" >Context · Triage</text><path d="M880 104H905m-6-5 6 5-6 5" fill="none" stroke="#6385ba"/><rect x="910" y="58" width="260" height="91" rx="9" fill="#0c1930" stroke="#2c4365"/><text x="928" y="81" font-size="10" fill="#a78bfa" class="mono" letter-spacing="1">STAGE 04</text><text x="928" y="109" font-size="23" fill="#edf5ff" font-weight="700">RESPOND</text><text x="928" y="133" font-size="13" fill="#a6b8d6" >Document · Improve</text><path d="M32 159H1168" stroke="#21385c"/><path class="current" d="M32 159H1168" stroke="#77e7ff" stroke-width="2"/><text x="600" y="183" font-size="11" fill="#a6b8d6" class="mono" text-anchor="middle" letter-spacing="1">EVIDENCE &gt; ASSUMPTIONS  //  SECURITY WORKFLOW</text></g><rect x="1" y="1" width="1198" height="198" rx="18" fill="none" stroke="#31466c" stroke-opacity=".8"/></svg>
